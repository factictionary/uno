<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Join DUO Cards Game Room</title>
  <meta name="description" content="Join a private game room in DUO Cards: Crazy 8s & Mau Mau!" />
  <meta name="theme-color" content="#0B1020" />
  <link rel="icon" type="image/png" href="../assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #070A18;
      --bg-1: #0B1020;
      --bg-2: #121838;
      --text: #F4F6FB;
      --text-dim: #A9B0C7;
      --red: #E63946;
      --yellow: #F2C744;
      --green: #2ECC71;
      --blue: #3C8DFF;
      --grad-cta: linear-gradient(135deg, #2ECC71 0%, #34E08C 100%);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1000px 700px at 50% 20%, rgba(60, 141, 255, 0.22), transparent 60%),
        radial-gradient(800px 600px at 20% 80%, rgba(46, 204, 113, 0.15), transparent 55%),
        var(--bg-0);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px -5px rgba(60, 141, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: block;
    }
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 24px;
      margin: 0 0 8px;
      font-weight: 800;
      color: #fff;
    }
    .room-badge {
      display: inline-block;
      margin: 16px 0;
      padding: 10px 20px;
      background: rgba(242, 199, 68, 0.15);
      border: 1px solid rgba(242, 199, 68, 0.4);
      border-radius: 12px;
      color: var(--yellow);
      font-family: 'Sora', monospace;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      cursor: pointer;
    }
    p {
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0 20px;
    }
    .btn-play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--grad-cta);
      color: #070A18;
      font-weight: 800;
      font-size: 16px;
      padding: 16px 24px;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(46, 204, 113, 0.5);
      transition: transform 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn-play:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      display: inline-block;
      margin-top: 12px;
      color: var(--blue);
      font-size: 13px;
      text-decoration: underline;
      background: none;
      border: none;
      cursor: pointer;
    }
    .status-toast {
      font-size: 13px;
      color: #34E08C;
      font-weight: 600;
      margin-top: 14px;
      min-height: 20px;
    }
    .instructions {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: var(--text-dim);
      text-align: left;
    }
    .instructions ol {
      margin: 8px 0 0;
      padding-left: 20px;
    }
    .instructions li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="../assets/icon.png" alt="DUO Cards" class="app-icon" />
    <h1>DUO CARDS</h1>
    <div id="roomSection" style="display: none;">
      <p style="margin-bottom: 4px;">You've been invited to join Room:</p>
      <div class="room-badge" id="roomCodeDisplay" onclick="copyRoomCode()" title="Click to copy">----</div>
      <div style="font-size: 11px; color: var(--text-dim); margin-top: -10px; margin-bottom: 16px;">(Tap code to copy)</div>
    </div>
    <p id="statusMsg">Connecting to game room...</p>

    <a id="launchBtn" class="btn-play" href="#" onclick="handleLaunchClick(event)">
      <span>▶ OPEN DUO CARDS</span>
    </a>

    <div>
      <a id="playStoreLink" class="btn-secondary" href="https://play.google.com/store/apps/details?id=in.factictionary.uno_card_game">
        Don't have the app? Get on Google Play
      </a>
    </div>

    <div class="status-toast" id="clipboardToast"></div>

    <div class="instructions">
      <strong>How to join:</strong>
      <ol>
        <li>If installed, tapping above opens <strong>DUO Cards</strong> directly.</li>
        <li>Your room code is auto-copied to join immediately!</li>
      </ol>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').trim().toUpperCase();

    const playStoreUrl = "https://play.google.com/store/apps/details?id=in.factictionary.uno_card_game" + 
      (code ? "&referrer=room%3D" + encodeURIComponent(code) : "");

    // Android Intent URI: Chrome uses this to launch the installed app directly.
    // If the app is NOT installed, Chrome automatically redirects to S.browser_fallback_url (Play Store).
    const intentUrl = "intent://uno.factictionary.in/join?code=" + encodeURIComponent(code) + 
      "#Intent;scheme=https;package=in.factictionary.uno_card_game;S.browser_fallback_url=" + 
      encodeURIComponent(playStoreUrl) + ";end;";

    document.getElementById('playStoreLink').href = playStoreUrl;

    function copyRoomCode() {
      if (!code) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("📋 Room code " + code + " copied!");
        }).catch(() => fallbackCopy(code));
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast("📋 Room code " + text + " copied!");
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      document.getElementById('clipboardToast').innerText = msg;
    }

    function handleLaunchClick(e) {
      copyRoomCode();
      // On mobile Android, intentUrl opens the app directly
      window.location.href = intentUrl;
    }

    if (code) {
      document.getElementById('roomSection').style.display = 'block';
      document.getElementById('roomCodeDisplay').innerText = code;
      document.getElementById('statusMsg').innerText = "Opening DUO Cards room " + code + "...";
      document.getElementById('launchBtn').href = intentUrl;

      // Try automatic launch via Android Intent URI
      setTimeout(() => {
        copyRoomCode();
        window.location.href = intentUrl;
      }, 500);
    } else {
      document.getElementById('statusMsg').innerText = "Download or launch DUO Cards on your phone to play.";
      document.getElementById('launchBtn').href = playStoreUrl;
    }
  </script>
</body>
</html>
